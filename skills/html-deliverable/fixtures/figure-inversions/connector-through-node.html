<!DOCTYPE html>
<html lang="en" data-theme="light" data-audience="internal">
<head>
<meta charset="utf-8">
<title>A connector routed through a node</title>
<style>
  body{margin:0; font-family:system-ui, sans-serif; background:#fff; color:#22262b}
  .page{max-width:900px; margin:0 auto; padding:24px}
  figure{margin:16px 0}
  .clip{overflow:hidden}
</style>
</head>
<body>
<div class="page">
<h1>A connector routed through a node</h1>
<p>The edge runs from the first box to the third at one height, straight through the second. This is what a route drawn at the MIDPOINT between two boxes does the moment an edge skips a column, and it is the third defect the broken fixture figure shipped with.</p>
<figure class="flow" aria-label="The map whose arrow goes through a box">
  <svg width="620" height="120" viewBox="0 0 620 120" role="img"><title>pierced</title>
    <path class="flow-edge" data-edge="first-third" d="M 130 60 L 480 60" fill="none" stroke="#676c7e" stroke-width="1.6"></path>
    <rect class="flow-node" data-node="first" x="20" y="31" width="110" height="58" rx="10" fill="#eef1f8" stroke="#0d32b2"></rect>
    <rect class="flow-node" data-node="second" x="240" y="31" width="110" height="58" rx="10" fill="#eef1f8" stroke="#0d32b2"></rect>
    <rect class="flow-node" data-node="third" x="480" y="31" width="110" height="58" rx="10" fill="#eef1f8" stroke="#0d32b2"></rect>
    <text class="flow-label" data-node="first" x="75" y="64" text-anchor="middle" font-size="11.5">First</text>
    <text class="flow-label" data-node="second" x="295" y="64" text-anchor="middle" font-size="11.5">Second</text>
    <text class="flow-label" data-node="third" x="535" y="64" text-anchor="middle" font-size="11.5">Third</text>
  </svg>
</figure>
</div>
</body>
</html>
